<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Agenda de Contactos</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="auth-body flex-center">

    <div class="auth-container shadow-lg">
        <div class="auth-header">
            <h2>Bienvenido</h2>
            <p id="auth-subtitle">Inicia sesión en tu agenda</p>
        </div>

        <form id="auth-form" class="auth-form">
            <!-- Dynamic field for signup -->
            <div class="form-group" id="name-group" style="display: none;">
                <label for="reg-name">Nombre Completo</label>
                <input type="text" id="reg-name" placeholder="Ej: Juan Pérez">
            </div>

            <div class="form-group">
                <label for="username">Usuario (Email o Nickname)</label>
                <input type="text" id="username" required placeholder="tu@correo.com">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <div id="auth-error" class="alert debug-alert"
                style="display:none; color: #dc2626; font-size: 0.875rem; margin-bottom: 1rem;">
                Credenciales incorrectas.
            </div>

            <button type="submit" class="btn-primary w-full" id="auth-btn"
                title="Haz clic para iniciar sesión">Acceder</button>
        </form>

        <div class="auth-footer">
            <p id="toggle-auth-text">¿No tienes credenciales? <a href="#" id="toggle-auth-link"
                    title="Simula el registro de un nuevo usuario en la app">Regístrate aquí</a></p>
            <p style="margin-top: 1rem;">
                <a href="index.html" class="text-secondary" title="Regresar al inicio">Volver al Inicio</a>
            </p>
        </div>
    </div>

    <!-- Script for handling login logic -->
    <script src="app.js"></script>
    <script>
        // Init login specifically
        document.addEventListener('DOMContentLoaded', () => {
            initAuth();
        });
    </script>
</body>

</html>
